[project]
name = "focus-tracker"
version = "0.1.0"
description = "Pomodoro focus leaderboard and ActivityWatch screen-time tracker for two users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
agent = [
    "aw-client>=0.5.15",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
